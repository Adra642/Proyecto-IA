[project]
name = "rag-project"
version = "0.1.0"
description = "RAG system on customer churn in European retail banking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "kagglehub>=1.0.3",
    "langchain>=1.5.2",
    "langchain-core>=1.8.3",
    "langchain-deepseek>=1.2.1",
    "langchain-google-genai>=4.5.1",
    "langchain-groq>=1.2.1",
    "lxml>=6.1.3",
    "markdownify>=1.2.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "tenacity>=9.1.4",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
]
docs = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pyyaml>=6.0.3",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
