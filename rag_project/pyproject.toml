[project]
name = "rag-project"
version = "0.1.0"
description = "RAG system on customer churn in European retail banking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "kagglehub>=1.0.3",
    "langchain>=1.5.2",
    "langchain-core>=1.8.3",
    "langchain-deepseek>=1.2.1",
    "langchain-google-genai>=4.5.1",
    "langchain-groq>=1.2.1",
    "lxml>=6.1.3",
    "markdownify>=1.2.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "tenacity>=9.1.4",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
]
docs = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pyyaml>=6.0.3",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/_site", "docs/.quarto"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "SIM"]
ignore = ["D100", "D104", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["core", "rag", "data_pipeline", "eval", "app", "tests"]
modules = ["factory"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kagglehub.*", "rank_bm25.*", "fitz.*", "pymupdf.*", "markdownify.*", "sentence_transformers.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["data_pipeline.util", "tests.*"]
disallow_untyped_calls = false  # pymupdf.Document is untyped

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --cov=core --cov=rag --cov=data_pipeline --cov-report=term-missing"
markers = ["integration: real network / LLM / model downloads (excluded by default)"]

[tool.coverage.run]
omit = ["*/__main__.py"]

[tool.poe.tasks]
pipeline = "python -m data_pipeline.run_all"
index = "python -m rag.index --rebuild"
eval = "python -m eval.run_eval"
app = "python app/app.py"
test = "pytest"
test-integration = "pytest -m integration --no-cov"
lint = ["_ruff-check", "_ruff-format"]
typecheck = "mypy"
docs = "quarto render docs"
export-reqs = "uv export --no-dev --no-hashes -o requirements.txt"
_ruff-check = "ruff check ."
_ruff-format = "ruff format --check ."
