# pytest.ini
# ==============================================================================
# ¿QUÉ ES ESTE ARCHIVO?
# Es el "manual de instrucciones" para nuestro inspector de pruebas (pytest).
# Cuando le decimos al ordenador "oye, revisa si mi código está bien", 
# el ordenador lee este archivo primero para saber cómo tiene que trabajar.
# ==============================================================================

[pytest]
# La línea de arriba "[pytest]" es como el título de un capítulo. 
# Le dice al ordenador: "Oye, las reglas que vienen a continuación son para el inspector".

# --- REGLA 1: ¿Dónde están los exámenes? ---
# testpaths = tests
# Le dice al inspector: "Busca los archivos de prueba (los exámenes) 
# ÚNICAMENTE dentro de la carpeta que se llama 'tests'". 
# Si no pusiéramos esto, el inspector se pondría a buscar por todo el ordenador
# y perdería muchísimo tiempo.
testpaths = tests

# --- REGLA 2: ¿Dónde está el material de estudio? ---
# pythonpath = .
# El punto "." significa "esta misma carpeta" (la carpeta raíz de nuestro proyecto).
# Le dice a Python: "Cuando el examen pregunte por el código que está en la carpeta 'src',
# búscalo aquí mismo, en la raíz". 
# Sin esta regla, Python se haría un lío, no encontraría nuestro archivo preprocessing.py
# y el examen fallaría con un error de "no encuentro el módulo".
pythonpath = .